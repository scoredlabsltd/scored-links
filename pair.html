<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Open Scored App</title>
  <meta name="description" content="Open Scored App" />
  <meta property="og:title" content="Open Scored App" />
  <meta property="og:description" content="Open Scored App" />
  <style>
    html, body { background: #000000; }
    body { font-family: sans-serif; margin: 0; padding: 24px; background: #000000; color: #ffffff; }
    .card { max-width: 460px; margin: 40px auto; background: #114164; border-radius: 14px; padding: 24px; }
    .muted { opacity: 0.86; }
    .row { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
    a.button { display: inline-block; text-decoration: none; color: #0a2a43; background: #9ad54b; font-weight: 700; padding: 10px 14px; border-radius: 8px; }
    a.secondary { background: #d1dde8; }
    .setup-help { display: none; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.22); }
    .setup-help h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .setup-help p { margin: 0; }
    .video-frame { margin-top: 14px; aspect-ratio: 9 / 16; max-height: 520px; background: #000000; border-radius: 8px; overflow: hidden; }
    .video-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <template id="iosTemplate">
  <div id="iosInstructions" class="card">
    <h1>Instructions for iOS (iPhone) Users</h1>
    <p class="muted">Follow the instructions on the video to download the Scored&trade; App. TestFlight is Apple&rsquo;s official platform for beta testing apps before they are made available on the App Store.</p>
    <div id="setupHelp" class="setup-help">
      <div class="video-frame">
        <iframe id="setupVideo" title="Scored setup video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="row">
        <a id="installTestFlight" class="button" href="https://testflight.apple.com/join/fj2Bv28x" target="_blank" rel="noopener">Download Scored on TestFlight</a>
      </div>
    </div>
  </div>
  </template>
  <script>
    (function () {
      var appId = "com.scoredlabs.scored";
      var appStoreSearchUrl = "https://apps.apple.com/us/search?term=Scored";
      var defaultAndroidInstallUrl = "https://play.google.com/apps/testing/com.scoredlabs.scored";
      var defaultIOSInstallUrl = "https://testflight.apple.com/join/fj2Bv28x";
      var defaultSetupVideoUrl = "https://www.youtube.com/shorts/qj6u0K6iIGA";
      var defaultSetupEmbedUrl = "https://www.youtube.com/embed/qj6u0K6iIGA?autoplay=1&mute=1&playsinline=1&rel=0";
      var params = new URLSearchParams(window.location.search);
      var payload = params.toString();
      var installUrlParam = params.get("installUrl");
      var installUrl = installUrlParam ? decodeURIComponent(installUrlParam) : "";
      var iosInstallUrl = "";
      var setupVideoUrlParam = params.get("setupVideoUrl") || params.get("videoUrl");
      var setupVideoUrl = setupVideoUrlParam ? decodeURIComponent(setupVideoUrlParam) : "";
      var installTargetUrl = "/install-target.json";
      var userAgent = navigator.userAgent || "";
      var isAndroid = /Android/i.test(userAgent);
      var isIOS = !isAndroid && (
        /iPhone|iPad|iPod|CriOS|FxiOS|EdgiOS/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
      if (isIOS) {
        document.body.appendChild(document.getElementById("iosTemplate").content.cloneNode(true));
      }
      var launchStartedAt = Date.now();
      var timers = [];
      var didUnload = false;
      var setupHelp = document.getElementById("setupHelp");
      var setupVideo = document.getElementById("setupVideo");
      var installTestFlight = document.getElementById("installTestFlight");

      if (!setupVideoUrl && isIOS) {
        setupVideoUrl = defaultSetupVideoUrl;
      }

      function getInstallDestination() {
        if (isIOS) {
          return iosInstallUrl || defaultIOSInstallUrl || appStoreSearchUrl;
        }

        if (installUrl) {
          return installUrl;
        }

        return defaultAndroidInstallUrl;
      }

      function getIOSSafeInstallDestination() {
        var destination = getInstallDestination();
        if (/groups\.google\.com\/g\/scored-prototype-users/i.test(destination)) {
          return defaultIOSInstallUrl || appStoreSearchUrl;
        }

        return destination;
      }

      function resolveInstallLinkFromConfig() {
        if (installUrlParam && setupVideoUrlParam) {
          refreshSetupHelp();
          return;
        }

        fetch(installTargetUrl, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) {
              return null;
            }

            return response.json();
          })
          .then(function (config) {
            if (config && typeof config.installUrl === "string" && config.installUrl) {
              installUrl = config.installUrl;
            }

            if (config && typeof config.iosInstallUrl === "string" && config.iosInstallUrl) {
              iosInstallUrl = config.iosInstallUrl;
            }

            if (!setupVideoUrlParam && config && typeof config.setupVideoUrl === "string" && config.setupVideoUrl) {
              setupVideoUrl = isIOS ? config.setupVideoUrl : "";
            }

            refreshSetupHelp();
          })
          .catch(function () {
            refreshSetupHelp();
          });
      }

      function refreshSetupHelp() {
        if (!isIOS) {
          return;
        }

        setupHelp.style.display = "block";
        setupVideo.src = defaultSetupEmbedUrl;
        installTestFlight.href = getIOSSafeInstallDestination();
      }

      // App Link and fallback scheme carry the same query payload.
      var appLink = "https://links.scoredlabs.com/pair" + (payload ? "?" + payload : "");
      var schemeLink = "scored://pair" + (payload ? "?" + payload : "");
      var currentNoHash = window.location.href.split("#")[0];
      var appLinkNoHash = appLink.split("#")[0];
      var shouldAttemptAppLink = currentNoHash !== appLinkNoHash;

      // Keep payload through Play referrer so backend/app can recover context.
      var referrerValue = encodeURIComponent("utm_source=qr" + (payload ? "&" + payload : ""));
      var playStoreMarket = "market://details?id=" + appId;
      var playStoreDetails = "https://play.google.com/store/apps/details?id=" + appId + "&referrer=" + referrerValue;
      var playStoreSearch = "https://play.google.com/store/search?q=" + encodeURIComponent(appId) + "&c=apps";
      var playStoreIntent =
        "intent://details?id=" +
        encodeURIComponent(appId) +
        "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" +
        encodeURIComponent(playStoreSearch) +
        ";end";
      var playStore = playStoreIntent;
      var intentLink =
        "intent://pair" +
        (payload ? "?" + payload : "") +
        "#Intent;scheme=scored;package=" +
        appId +
        ";S.browser_fallback_url=" +
        encodeURIComponent(playStoreSearch) +
        ";end";
      refreshSetupHelp();
      resolveInstallLinkFromConfig();

      function scheduleRedirect(urlOrResolver, delay, allowWhenResumed) {
        var timer = setTimeout(function () {
          if (didUnload) {
            return;
          }

          // If the page spent time in background (app switch), do not fire late fallbacks.
          var elapsed = Date.now() - launchStartedAt;
          if (!allowWhenResumed && elapsed > delay + 1500) {
            return;
          }

          var url = typeof urlOrResolver === "function" ? urlOrResolver() : urlOrResolver;
          if (!url) {
            return;
          }
          window.location.replace(url);
        }, delay);
        timers.push(timer);
      }

      function stopTimers() {
        for (var i = 0; i < timers.length; i++) {
          clearTimeout(timers[i]);
        }
        timers = [];
      }

      window.addEventListener("pagehide", function () {
        didUnload = true;
        stopTimers();
      });

      // Avoid reloading the same landing URL (can cause loops/freezes on some browsers).
      if (!isIOS && shouldAttemptAppLink) {
        window.location.replace(appLink);
      }

      if (isAndroid) {
        // Try custom scheme first to avoid browser fallback behavior from intent URLs.
        scheduleRedirect(schemeLink, 300, false);

        // If still on page, send Android users straight to Google Play.
        scheduleRedirect(function () {
          return installUrl || defaultAndroidInstallUrl || playStoreDetails || playStore;
        }, 1600, false);
        return;
      }

      if (isIOS) {
        return;
      }

      // Desktop or unknown platform: keep page blank without forced redirects.
    })();

  </script>
</body>
</html>
