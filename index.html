<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Open Scored App</title>
  <meta name="description" content="Open Scored App" />
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px; background: #000000; color: #ffffff; }
    main { max-width: 460px; margin: 40px auto; background: #000000; border-radius: 14px; padding: 24px; }
    a { color: #9ad54b; }
  </style>
</head>
<body>
  <main>
    <h1>Scored</h1>
    <p><a id="openApp" href="/open.html">Open Scored App</a></p>
  </main>
  <script>
    (function () {
      var destination = "/open.html" + window.location.search + window.location.hash;
      document.getElementById("openApp").href = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
