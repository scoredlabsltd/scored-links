<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Scored App</title>
  <meta name="description" content="Open Scored App" />
  <meta property="og:title" content="Open Scored App" />
  <meta property="og:description" content="Open Scored App" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000000;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var shortCodePattern = /^[A-Z0-9]{6,12}$/;
      var pathParts = window.location.pathname.split("/").filter(Boolean);
      var pathCode = pathParts.length ? decodeURIComponent(pathParts[pathParts.length - 1]).trim().toUpperCase() : "";
      var resolverBaseUrl = "https://atwywgpbttnqxihlxhqj.supabase.co/functions/v1/resolve-token";

      if (pathParts.length === 1 && pathCode.length === 8) {
        window.location.replace('/open.html?customerCode=' + encodeURIComponent(pathCode) + '&purpose=public-code');
        return;
      }
      if (pathParts.length === 1 && shortCodePattern.test(pathCode)) {
        window.location.replace(resolverBaseUrl + "/" + encodeURIComponent(pathCode));
        return;
      }

      window.location.replace("/open.html" + window.location.search + window.location.hash);
    })();
  </script>
</body>
</html>
